<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Villain Series - Gilbert Power Sports</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .bg-segway { background-color: #1a365d; }
        .text-segway { color: #1a365d; }
    </style>
</head>
<body class="bg-gray-50">
    <!-- Header -->
    <header id="header"></header>

    <!-- Main Content -->
    <main>
        <!-- Breadcrumbs -->
        <div class="bg-gray-50 py-8">
            <div class="container mx-auto px-4">
                <nav class="flex" aria-label="Breadcrumb">
                    <ol class="inline-flex items-center space-x-1 md:space-x-3">
                        <li class="inline-flex items-center">
                            <a href="../index.html" class="inline-flex items-center text-sm font-medium text-gray-700 hover:text-red-600">
                                Home
                            </a>
                        </li>
                        <li>
                            <div class="flex items-center">
                                <svg class="w-3 h-3 text-gray-400 mx-1" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 6 10">
                                    <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m1 9 4-4-4-4"/>
                                </svg>
                                <a href="../side-by-side.html" class="ml-1 text-sm font-medium text-gray-700 hover:text-red-600 md:ml-2">
                                    Side-by-Sides
                                </a>
                            </div>
                        </li>
                        <li aria-current="page">
                            <div class="flex items-center">
                                <svg class="w-3 h-3 text-gray-400 mx-1" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 6 10">
                                    <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m1 9 4-4-4-4"/>
                                </svg>
                                <span class="ml-1 text-sm font-medium text-gray-500 md:ml-2">Villain Series</span>
                            </div>
                        </li>
                    </ol>
                </nav>
            </div>
        </div>

        <!-- Product Gallery -->
        <section class="py-12">
            <div class="container mx-auto px-4">
                <div class="grid grid-cols-1 lg:grid-cols-2 gap-8 items-center">
                    <div class="space-y-4">
                        <div class="relative h-96 bg-gray-100 rounded-lg overflow-hidden">
                            <img id="main-image" src="" alt="" class="w-full h-full object-cover">
                        </div>
                        <div class="grid grid-cols-3 gap-4" id="thumbnail-gallery">
                            <!-- Thumbnails will be populated by JavaScript -->
                        </div>
                    </div>
                    
                    <div class="space-y-6">
                        <h1 id="model-name" class="text-4xl font-bold text-gray-900"></h1>
                        <div class="flex items-center gap-3">
                            <p id="model-price" class="text-2xl font-semibold text-red-600"></p>
                            <span id="variant-name" class="text-lg text-gray-500"></span>
                        </div>
                        
                        <div class="pt-4 border-t border-gray-200">
                            <h2 class="text-lg font-medium text-gray-900">Model Variants</h2>
                            <div class="mt-3 grid grid-cols-2 gap-3" id="variants-container">
                                <!-- Variants will be populated by JavaScript -->
                            </div>
                        </div>
                        
                        <div class="pt-4 border-t border-gray-200">
                            <h2 class="text-lg font-medium text-gray-900">Available Colors</h2>
                            <div class="mt-3 flex space-x-2" id="colors-container">
                                <!-- Colors will be populated by JavaScript -->
                            </div>
                            <p class="text-sm text-gray-600 mt-2">
                                Selected: <span id="selected-color-name"></span>
                            </p>
                        </div>
                        
                        <div class="pt-4 border-t border-gray-200">
                            <h2 class="text-lg font-medium text-gray-900">Key Features</h2>
                            <ul class="mt-3 space-y-2" id="features-list">
                                <!-- Features will be populated by JavaScript -->
                            </ul>
                        </div>
                        
                        <div class="pt-4">
                            <button class="w-full bg-red-600 text-white py-3 px-6 rounded-md hover:bg-red-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-red-500 transition-colors">
                                Schedule a Test Drive
                            </button>
                            <p class="mt-2 text-center text-sm text-gray-500">
                                Or call us at (123) 456-7890
                            </p>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <!-- Specifications -->
        <section class="bg-gray-50 py-16">
            <div class="container mx-auto px-4">
                <h2 class="text-3xl font-bold text-center mb-12">Specifications</h2>
                <div class="bg-white rounded-lg shadow overflow-hidden">
                    <table class="min-w-full divide-y divide-gray-200">
                        <tbody class="divide-y divide-gray-200" id="specs-table">
                            <!-- Specifications will be populated by JavaScript -->
                        </tbody>
                    </table>
                </div>
            </div>
        </section>

        <!-- Call to Action -->
        <section class="bg-segway text-white py-16">
            <div class="container mx-auto px-4 text-center">
                <h2 class="text-3xl font-bold mb-4">Ready to experience the <span id="cta-model-name"></span> <span id="cta-variant-name"></span>?</h2>
                <p class="text-xl mb-8 max-w-2xl mx-auto">
                    Contact us today to schedule a test drive of the <span id="cta-variant-name-2"></span> variant in <span id="cta-color-name"></span> or learn more about our financing options.
                </p>
                <div class="flex flex-col sm:flex-row justify-center gap-4">
                    <button class="bg-white text-red-600 font-semibold py-3 px-8 rounded-md hover:bg-gray-100 transition-colors">
                        Contact Us
                    </button>
                    <button class="bg-transparent border-2 border-white text-white font-semibold py-3 px-8 rounded-md hover:bg-white/10 transition-colors">
                        View Financing Options
                    </button>
                </div>
            </div>
        </section>
    </main>

    <!-- Footer -->
    <footer id="footer"></footer>

    <!-- Scripts -->
    <script src="../js/components.js"></script>
    <script src="../js/main.js"></script>
    <script src="../js/model-page.js"></script>
    <script>
        // Initialize the model page with UT10 data
        document.addEventListener('DOMContentLoaded', function() {
            initModelPage('villain');
        });
    </script>
</body>
</html>
