        // Parse URL and render appropriate content
        function loadPageContent() {
            const pathParts = window.location.pathname.split('/').filter(part => part);
            
            // Check if we're viewing a specific model
            if (pathParts.length === 2 && pathParts[0] === 'side-by-side') {
                const modelId = pathParts[1];
                const model = sideBySideModels[modelId];
                
                if (model) {
                    renderModelPage(model);
                } else {
                    render404();
                }
            } else {
                // Default to overview page
                renderOverviewPage();
            }
        }

        // Render model overview page
        function renderOverviewPage() {
            document.getElementById('page-title').textContent = 'Side-by-Side Vehicles - Gilbert Power Sports';
            document.getElementById('main-content').innerHTML = `
                <!-- Hero Section -->
                <div class="bg-gray-900 text-white py-20">
                    <div class="container mx-auto px-4">

                        <p class="text-xl md:text-2xl text-gray-300 max-w-3xl">
                            Experience the perfect blend of power, performance, and precision for all your off-road adventures.
                        </p>
                    </div>
                </div>

                <!-- Model Grid -->

                                   onclick="navigateToModel('${model.id}', event)">

                                        <img src="${model.images[0]}" 
                                             alt="${model.name}" 
                                             class="w-full h-full object-cover transition-transform duration-300 group-hover:scale-105">

                                    </div>
                                </li>

                                        ${model.colors.map(color => `
                                            <button class="w-8 h-8 rounded-full border-2 border-gray-300 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-red-500"
                                                    style="background-color: ${color.value}"

                    <div class="container mx-auto px-4 text-center">
                        <h2 class="text-3xl font-bold mb-4">Ready to experience the ${model.name}?</h2>
                        <p class="text-xl mb-8 max-w-2xl mx-auto">
                            Contact us today to schedule a test drive or learn more about our financing options.
                        </p>
                        <div class="flex flex-col sm:flex-row justify-center gap-4">
                            <button onclick="window.location.href='/contact'" 
                                    class="bg-white text-red-600 font-semibold py-3 px-8 rounded-md hover:bg-gray-100 transition-colors">
                                Contact Us
                            </button>
                            <button class="bg-transparent border-2 border-white text-white font-semibold py-3 px-8 rounded-md hover:bg-white/10 transition-colors">
                                View Financing Options
                            </button>
                        </div>
                    </div>
                </section>
            `;
        }

        // Render 404 page
        function render404() {
            document.getElementById('page-title').textContent = 'Model Not Found - Gilbert Power Sports';
            document.getElementById('main-content').innerHTML = `
                <div class="py-20 text-center">
                    <h1 class="text-4xl font-bold text-gray-900 mb-4">Model Not Found</h1>
                    <p class="text-gray-600 mb-8">The model you're looking for doesn't exist.</p>
                    <a href="/side-by-side" onclick="navigateToOverview(event)" 
                       class="bg-red-600 text-white px-6 py-3 rounded-md hover:bg-red-700 transition-colors">
                        View All Models
                    </a>
                </div>
            `;
        }

        // Navigation functions
        function navigateToModel(modelId, event) {
            event.preventDefault();
            history.pushState({}, '', `/side-by-side/${modelId}`);
            loadPageContent();
        }

        function navigateToOverview(event) {
            event.preventDefault();
            history.pushState({}, '', '/side-by-side');
            loadPageContent();
        }

        function changeMainImage(imageSrc) {
            document.getElementById('main-image').src = imageSrc;
        }

        // Handle browser back/forward buttons
        window.addEventListener('popstate', loadPageContent);

        // Initialize page when DOM loads
        document.addEventListener('DOMContentLoaded', loadPageContent);
    </script>
</body>
</html>
